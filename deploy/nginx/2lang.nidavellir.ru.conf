# 2Lang PWA — статика из релиза, собранного deploy/deploy.sh.
# Ставится в /etc/nginx/sites-available и включается симлинком в sites-enabled
# (порядок — .flow/runbook.md). Сертификат выпускает certbot certonly --nginx.

server {
    listen 80;
    server_name 2lang.nidavellir.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 2lang.nidavellir.ru;

    ssl_certificate     /etc/letsencrypt/live/2lang.nidavellir.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2lang.nidavellir.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/hawk/2lang/.releases/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Имена в assets/ содержат хэш содержимого — кэшируются навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Оболочка и service worker должны перепроверяться при каждом заходе,
    # иначе установленное PWA не увидит новый релиз.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA: любые маршруты приложения отдаются index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
